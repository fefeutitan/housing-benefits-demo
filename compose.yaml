services:
  postgres:
    image: postgres:17-alpine
    container_name: housing-benefits-postgres
    environment:
      POSTGRES_DB: housing_benefits
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-housing_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing_benefits"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
